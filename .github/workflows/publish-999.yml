name: Publish HYPER Ghoul RUSH 999

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-999.yml"
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Build site from latest release SB3
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import io
          import json
          import urllib.request
          import zipfile
          from pathlib import Path

          OWNER = "chubachikazukazu-hub"
          REPO = "hyper-ghoul-rush-999"
          SITE = Path("site")
          ASSETS = SITE / "assets"
          SITE.mkdir(exist_ok=True)
          ASSETS.mkdir(exist_ok=True)

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0 GitHub-Actions"})
              with urllib.request.urlopen(req, timeout=600) as r:
                  return r.read()

          rel = json.loads(get(f"https://api.github.com/repos/{OWNER}/{REPO}/releases/latest"))
          sb3s = [a for a in rel.get("assets", []) if a.get("name", "").lower().endswith(".sb3")]
          if not sb3s:
              raise RuntimeError("Latest release has no .sb3 asset")

          print("Downloading:", sb3s[0]["name"], sb3s[0]["size"], "bytes")
          sb3 = get(sb3s[0]["browser_download_url"])

          with zipfile.ZipFile(io.BytesIO(sb3)) as z:
              (SITE / "project.json").write_bytes(z.read("project.json"))
              count = 0
              for info in z.infolist():
                  if info.is_dir() or info.filename == "project.json":
                      continue
                  name = Path(info.filename).name
                  if not name:
                      continue
                  (ASSETS / name).write_bytes(z.read(info))
                  count += 1

          print("Extracted assets:", count)

          scaff = get("https://cdn.jsdelivr.net/npm/@turbowarp/scaffolding@0.4.0/dist/scaffolding-with-music.js")
          (SITE / "scaffolding.js").write_bytes(scaff)
          (SITE / ".nojekyll").write_text("", encoding="utf-8")

          html_b64 = ""
          (SITE / "index.html").write_bytes(base64.b64decode(html_b64))
          print("Site files ready:", sum(1 for p in SITE.rglob("*") if p.is_file()))
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
